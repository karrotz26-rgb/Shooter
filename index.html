<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Bot Slinger</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <script src="assets/phaser-arcade-physics.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #0a0710; touch-action: none; }
        #game-container { width: 100%; height: 100%; cursor: default; }
    </style>
</head>
<body>
<div id="game-container"></div>

<script>
    const WIDTH = 960;
    const HEIGHT = 540;

    const config = {
        type: Phaser.AUTO,
        parent: 'game-container',
        width: WIDTH,
        height: HEIGHT,
        scale: {
            mode: Phaser.Scale.FIT,
            autoCenter: Phaser.Scale.CENTER_BOTH
        },
        physics: {
            default: 'arcade',
            arcade: { gravity: { y: 900 }, debug: false }
        },
        input: { activePointers: 2 },
        scene: { preload, create, update }
    };

    const game = new Phaser.Game(config);

    // ---- Slingshot hand geometry (assets/sling_hand.png: first-person hand
    // gripping the fork, trimmed tight with the wrist deliberately cut off at
    // the bottom edge so it can be anchored flush to the bottom of the screen) ----
    const HAND_X = WIDTH / 2;
    // Key points measured on the trimmed source art (243x294 canvas)
    const HAND = {
        canvasW: 243, canvasH: 294, displayH: 280,
        prongTipL: { x: 91, y: 25 },
        prongTipR: { x: 205, y: 25 }
    };
    HAND.scale = HAND.displayH / HAND.canvasH;
    function handToWorld(lx, ly) {
        return {
            x: HAND_X + (lx - HAND.canvasW / 2) * HAND.scale,
            y: HEIGHT - (HAND.canvasH - ly) * HAND.scale
        };
    }
    const PRONG_L = handToWorld(HAND.prongTipL.x, HAND.prongTipL.y);
    const PRONG_R = handToWorld(HAND.prongTipR.x, HAND.prongTipR.y);
    const ANCHOR = {
        x: (PRONG_L.x + PRONG_R.x) / 2,
        y: (PRONG_L.y + PRONG_R.y) / 2
    };
    const MAX_PULL = 150;
    const MIN_PULL = 18;
    const LAUNCH_POWER = 6.4;

    // ---- Bot types: key, points, display size, rarity weight ----
    const BOT_TYPES = [
        { key: 'bot_spider', points: 1, w: 70, h: 46, weight: 45 },
        { key: 'bot_orb',    points: 2, w: 76, h: 52, weight: 30 },
        { key: 'bot_walker', points: 3, w: 84, h: 58, weight: 18 },
        { key: 'bot_gunner', points: 5, w: 88, h: 64, weight: 7 }
    ];
    const MAX_BOTS = 4;
    const BOT_LIFESPAN = 3200;
    const SPAWN_INTERVAL = 1100;
    const ROUND_SECONDS = 45;
    const HIGH_SCORE_KEY = 'botSlingerHighScores';
    const MAX_HIGH_SCORES = 5;
    const PLAY_AREA = { xMin: 70, xMax: 890, yMin: 70, yMax: 280 };

    let score = 0;
    let scoreText, timerText;
    let timeLeft = ROUND_SECONDS;
    let spawnTimerEvent, countdownEvent;
    let gameState = 'start';
    let startScreen, gameOverScreen, finalScoreText, highScoreText;

    let bots, rocks;
    let trailGfx, slingGfx, previewGfx;
    let aiming = false;
    let pouch = { x: ANCHOR.x, y: ANCHOR.y };
    let pouchRock = null;

    function pickBotType() {
        const total = BOT_TYPES.reduce((s, t) => s + t.weight, 0);
        let r = Math.random() * total;
        for (const t of BOT_TYPES) {
            if (r < t.weight) return t;
            r -= t.weight;
        }
        return BOT_TYPES[0];
    }

    function dist(a, b) {
        return Math.hypot(a.x - b.x, a.y - b.y);
    }

    // ---- Audio (synthesized, no sound files needed) ----
    let audioCtx;
    function getAudioContext() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
    }

    function playShootSound() {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.15);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
        osc.connect(gain).connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.17);
    }

    function playHitSound(points) {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const baseFreq = 480 + points * 30;
        [0, 0.07].forEach((offset, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(baseFreq * (i === 0 ? 1 : 1.6), now + offset);
            gain.gain.setValueAtTime(0.18, now + offset);
            gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.16);
            osc.connect(gain).connect(ctx.destination);
            osc.start(now + offset);
            osc.stop(now + offset + 0.18);
        });
    }

    // ---- High scores (localStorage only, no backend) ----
    function loadHighScores() {
        try {
            const raw = JSON.parse(localStorage.getItem(HIGH_SCORE_KEY));
            return Array.isArray(raw) ? raw : [];
        } catch (e) {
            return [];
        }
    }

    function saveHighScore(newScore) {
        const scores = loadHighScores();
        scores.push(newScore);
        scores.sort((a, b) => b - a);
        const top = scores.slice(0, MAX_HIGH_SCORES);
        try { localStorage.setItem(HIGH_SCORE_KEY, JSON.stringify(top)); } catch (e) { /* storage unavailable */ }
        return top;
    }

    function preload() {
        this.load.image('bg', 'Bg.jpeg');
        this.load.image('hand', 'assets/sling_hand.png');
        this.load.image('bot_walker', 'assets/bot_walker.png');
        this.load.image('bot_orb', 'assets/bot_orb.png');
        this.load.image('bot_gunner', 'assets/bot_gunner.png');
        this.load.image('bot_spider', 'assets/bot_spider.png');
        this.load.image('rock', 'assets/rock.png');
        this.load.spritesheet('explosion', 'assets/explosion_sheet.png', { frameWidth: 136, frameHeight: 92 });
    }

    function spawnBot() {
        if (bots.getLength() >= MAX_BOTS) return;

        const type = pickBotType();
        const x = Phaser.Math.Between(PLAY_AREA.xMin, PLAY_AREA.xMax);
        const y = Phaser.Math.Between(PLAY_AREA.yMin, PLAY_AREA.yMax);

        const bot = bots.create(x, y, type.key);
        bot.body.setAllowGravity(false);
        bot.setDisplaySize(type.w, type.h);
        bot.setData('points', type.points);
        bot.setData('baseY', y);
        bot.setData('seed', Math.random() * 1000);
        bot.setDepth(20);
        const tsx = type.w / bot.width, tsy = type.h / bot.height;
        bot.setScale(0);
        this.tweens.add({ targets: bot, scaleX: tsx, scaleY: tsy, duration: 220, ease: 'Back.Out' });

        bot.setData('expireTimer', this.time.delayedCall(BOT_LIFESPAN, () => removeBot.call(this, bot)));
    }

    function removeBot(bot) {
        if (!bot.active || bot.getData('hit')) return;
        bot.setData('hit', true);
        const timer = bot.getData('expireTimer');
        if (timer) timer.remove(false);
        this.tweens.add({
            targets: bot, alpha: 0, scaleX: bot.scaleX * 0.6, scaleY: bot.scaleY * 0.6, duration: 200, ease: 'Cubic.In',
            onComplete: () => bot.destroy()
        });
    }

    function showFloatingPoints(x, y, points) {
        const label = this.add.text(x, y, '+' + points, {
            fontSize: '22px', fontFamily: 'Georgia, serif', color: '#ffe27a',
            stroke: '#2a1005', strokeThickness: 4
        }).setOrigin(0.5).setDepth(120);

        this.tweens.add({
            targets: label, y: y - 40, alpha: 0, duration: 700, ease: 'Cubic.Out',
            onComplete: () => label.destroy()
        });
    }

    function explodeAt(scene, x, y, width) {
        const height = width * (92 / 136);
        const boom = scene.add.sprite(x, y, 'explosion').setDepth(110);
        boom.setDisplaySize(width, height);
        boom.play('explode');
        boom.on('animationcomplete', () => boom.destroy());
    }

    function onRockHitBot(rock, bot) {
        if (bot.getData('hit')) return;
        bot.setData('hit', true);
        const timer = bot.getData('expireTimer');
        if (timer) timer.remove(false);

        const points = bot.getData('points');
        score += points;
        scoreText.setText('Score: ' + score);
        playHitSound(points);
        showFloatingPoints.call(this, bot.x, bot.y, points);
        explodeAt(this, bot.x, bot.y, bot.displayWidth * 1.8);

        this.tweens.add({
            targets: bot, scale: bot.scale * 1.3, alpha: 0, duration: 160, ease: 'Cubic.Out',
            onComplete: () => bot.destroy()
        });

        rock.getData('trail').length = 0;
        rock.destroy();
    }

    function updatePouchFromPointer(pointer) {
        const vx = pointer.x - ANCHOR.x;
        const vy = pointer.y - ANCHOR.y;
        const d = Math.hypot(vx, vy);
        if (d > MAX_PULL) {
            pouch.x = ANCHOR.x + (vx / d) * MAX_PULL;
            pouch.y = ANCHOR.y + (vy / d) * MAX_PULL;
        } else {
            pouch.x = ANCHOR.x + vx;
            pouch.y = ANCHOR.y + vy;
        }
    }

    function drawSling() {
        slingGfx.clear();
        if (!aiming) return;

        // rubber bands from the boy's hands (already gripping the fork in the
        // art) out to the pouch
        slingGfx.lineStyle(4, 0x3a2a1a, 1);
        slingGfx.lineBetween(PRONG_L.x, PRONG_L.y, pouch.x, pouch.y);
        slingGfx.lineBetween(PRONG_R.x, PRONG_R.y, pouch.x, pouch.y);

        // pouch
        slingGfx.fillStyle(0x2a1c12, 1);
        slingGfx.fillCircle(pouch.x, pouch.y, 9);
    }

    function drawTrajectoryPreview() {
        previewGfx.clear();
        if (!aiming) return;
        const pull = dist(ANCHOR, pouch);
        if (pull < MIN_PULL) return;

        const vx = -(pouch.x - ANCHOR.x) * LAUNCH_POWER;
        const vy = -(pouch.y - ANCHOR.y) * LAUNCH_POWER;
        const g = 900;
        let x = pouch.x, y = pouch.y;
        previewGfx.fillStyle(0xfff4d6, 0.5);
        for (let i = 1; i <= 10; i++) {
            const t = i * 0.06;
            const px = pouch.x + vx * t;
            const py = pouch.y + vy * t + 0.5 * g * t * t;
            if (py > HEIGHT + 20 || px < 0 || px > WIDTH) break;
            previewGfx.fillCircle(px, py, 3);
        }
    }

    function launchRock(scene) {
        const vx = -(pouch.x - ANCHOR.x) * LAUNCH_POWER;
        const vy = -(pouch.y - ANCHOR.y) * LAUNCH_POWER;

        const rock = rocks.create(pouch.x, pouch.y, 'rock');
        rock.setDisplaySize(30, 16);
        rock.setDepth(15);
        rock.setData('trail', []);
        rock.body.setAllowGravity(true);
        rock.body.setVelocity(vx, vy);
        rock.setAngularVelocity(Phaser.Math.Between(-360, 360));
        playShootSound();
    }

    function drawHand(scene) {
        scene.add.image(HAND_X, HEIGHT, 'hand')
            .setOrigin(0.5, 1)
            .setDisplaySize(HAND.canvasW * HAND.scale, HAND.canvasH * HAND.scale)
            .setDepth(25);
    }

    function clearBots() {
        bots.getChildren().slice().forEach(b => {
            const timer = b.getData('expireTimer');
            if (timer) timer.remove(false);
        });
        bots.clear(true, true);
    }

    function clearRocks() {
        rocks.clear(true, true);
        trailGfx.clear();
    }

    function startGame() {
        gameState = 'playing';
        getAudioContext(); // unlock audio on the real user gesture

        score = 0;
        scoreText.setText('Score: 0');
        timeLeft = ROUND_SECONDS;
        timerText.setText('Time: ' + timeLeft);

        clearBots();
        clearRocks();
        startScreen.setVisible(false);
        gameOverScreen.setVisible(false);

        spawnBot.call(this);
        spawnTimerEvent = this.time.addEvent({ delay: SPAWN_INTERVAL, callback: spawnBot, callbackScope: this, loop: true });
        countdownEvent = this.time.addEvent({
            delay: 1000, loop: true, callbackScope: this,
            callback: () => {
                timeLeft--;
                timerText.setText('Time: ' + timeLeft);
                if (timeLeft <= 0) endGame.call(this);
            }
        });
    }

    function endGame() {
        gameState = 'gameover';
        aiming = false;
        if (pouchRock) { pouchRock.destroy(); pouchRock = null; }
        drawSling();
        previewGfx.clear();

        if (spawnTimerEvent) spawnTimerEvent.remove();
        if (countdownEvent) countdownEvent.remove();
        clearBots();
        clearRocks();

        const scores = saveHighScore(score);
        finalScoreText.setText('Score: ' + score);
        highScoreText.setText('High Scores\n' + scores.map((s, i) => (i + 1) + '. ' + s).join('\n'));
        gameOverScreen.setVisible(true);
    }

    function create() {
        const bg = this.add.image(WIDTH / 2, HEIGHT / 2, 'bg');
        const scale = Math.max(WIDTH / bg.width, HEIGHT / bg.height);
        bg.setScale(scale).setDepth(0);

        this.anims.create({
            key: 'explode',
            frames: this.anims.generateFrameNumbers('explosion', { start: 0, end: 11 }),
            frameRate: 24,
            repeat: 0
        });

        bots = this.physics.add.group({ allowGravity: false });
        rocks = this.physics.add.group();

        this.physics.add.overlap(rocks, bots, onRockHitBot, undefined, this);

        drawHand(this);
        trailGfx = this.add.graphics().setDepth(14);
        slingGfx = this.add.graphics().setDepth(26);
        previewGfx = this.add.graphics().setDepth(26);

        scoreText = this.add.text(16, 16, 'Score: 0', {
            fontSize: '26px', fontFamily: 'Impact, Arial Black, sans-serif', color: '#fff4d6',
            stroke: '#2a1005', strokeThickness: 5
        }).setDepth(100);

        timerText = this.add.text(WIDTH - 16, 16, 'Time: ' + ROUND_SECONDS, {
            fontSize: '26px', fontFamily: 'Impact, Arial Black, sans-serif', color: '#fff4d6',
            stroke: '#2a1005', strokeThickness: 5
        }).setOrigin(1, 0).setDepth(100);

        // ---- Slingshot input: finger down = pull back, drag = aim, release = fire ----
        this.input.on('pointerdown', (pointer) => {
            if (gameState !== 'playing') return;
            aiming = true;
            updatePouchFromPointer(pointer);
            pouchRock = this.add.image(pouch.x, pouch.y, 'rock').setDisplaySize(30, 16).setDepth(27);
            drawSling();
            drawTrajectoryPreview();
        });

        this.input.on('pointermove', (pointer) => {
            if (!aiming) return;
            updatePouchFromPointer(pointer);
            if (pouchRock) pouchRock.setPosition(pouch.x, pouch.y);
            drawSling();
            drawTrajectoryPreview();
        });

        const release = () => {
            if (!aiming) return;
            aiming = false;
            const pull = dist(ANCHOR, pouch);
            if (pull >= MIN_PULL && gameState === 'playing') {
                launchRock(this);
            }
            if (pouchRock) { pouchRock.destroy(); pouchRock = null; }
            drawSling();
            previewGfx.clear();
        };
        this.input.on('pointerup', release);
        this.input.on('pointerupoutside', release);

        // Start screen
        const startOverlay = this.add.rectangle(WIDTH / 2, HEIGHT / 2, WIDTH, HEIGHT, 0x000000, 0.55)
            .setInteractive({ useHandCursor: true })
            .on('pointerdown', () => startGame.call(this));
        const startTitle = this.add.text(WIDTH / 2, HEIGHT / 2 - 80, 'Bot Slinger', {
            fontSize: '52px', fontFamily: 'Impact, Arial Black, sans-serif', color: '#fff4d6',
            stroke: '#2a1005', strokeThickness: 7
        }).setOrigin(0.5);
        const startPrompt = this.add.text(WIDTH / 2, HEIGHT / 2,
            'Touch & hold to pull back the slingshot\nDrag to aim, let go to fire!\n' + ROUND_SECONDS + ' seconds - take down as many bots as you can.', {
            fontSize: '20px', fontFamily: 'Georgia, serif', color: '#fff4d6', align: 'center', lineSpacing: 8
        }).setOrigin(0.5);
        startScreen = this.add.container(0, 0, [startOverlay, startTitle, startPrompt]).setDepth(200);

        // Game over screen
        const gameOverOverlay = this.add.rectangle(WIDTH / 2, HEIGHT / 2, WIDTH, HEIGHT, 0x000000, 0.7)
            .setInteractive({ useHandCursor: true })
            .on('pointerdown', () => startGame.call(this));
        const gameOverTitle = this.add.text(WIDTH / 2, HEIGHT / 2 - 110, "Time's Up!", {
            fontSize: '42px', fontFamily: 'Impact, Arial Black, sans-serif', color: '#fff4d6',
            stroke: '#2a1005', strokeThickness: 7
        }).setOrigin(0.5);
        finalScoreText = this.add.text(WIDTH / 2, HEIGHT / 2 - 60, 'Score: 0', {
            fontSize: '24px', fontFamily: 'Georgia, serif', color: '#fff4d6'
        }).setOrigin(0.5);
        highScoreText = this.add.text(WIDTH / 2, HEIGHT / 2 + 30, 'High Scores', {
            fontSize: '20px', fontFamily: 'Georgia, serif', color: '#fff4d6', align: 'center', lineSpacing: 6
        }).setOrigin(0.5);
        const playAgainPrompt = this.add.text(WIDTH / 2, HEIGHT / 2 + 150, 'Tap to Play Again', {
            fontSize: '20px', fontFamily: 'Georgia, serif', color: '#fff4d6'
        }).setOrigin(0.5);
        gameOverScreen = this.add.container(0, 0,
            [gameOverOverlay, gameOverTitle, finalScoreText, highScoreText, playAgainPrompt]
        ).setDepth(200).setVisible(false);
    }

    function update(time) {
        // gentle bob for bots so the scene feels alive
        bots.getChildren().forEach((bot) => {
            const baseY = bot.getData('baseY');
            const seed = bot.getData('seed');
            bot.y = baseY + Math.sin((time + seed) / 300) * 6;
            bot.body.updateFromGameObject();
        });

        // rock trails + offscreen/ground cleanup
        trailGfx.clear();
        rocks.getChildren().slice().forEach((rock) => {
            const trail = rock.getData('trail');
            trail.push({ x: rock.x, y: rock.y });
            while (trail.length > 14) trail.shift();
            trail.forEach((p, i) => {
                const f = (i + 1) / trail.length;
                trailGfx.fillStyle(0x888888, f * 0.5);
                trailGfx.fillCircle(p.x, p.y, 2 + f * 3);
            });

            if (rock.y > HEIGHT + 30 || rock.x < -40 || rock.x > WIDTH + 40 || rock.y < -60) {
                rock.destroy();
            }
        });
    }
</script>

</body>
</html>
